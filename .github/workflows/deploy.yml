name: Build and Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ECS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Build Backend
      run: |
        cd backend
        cargo build --release

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Package release
      run: |
        tar -czf blog-release.tar.gz \
          backend/target/release/blog-backend \
          frontend/dist \
          deploy/blog-api.service \
          deploy/blog.service \
          deploy/nginx.conf

    - name: Debug Secrets
      run: |
        echo "Checking if secrets are loaded..."
        if [ -z "${{ secrets.ECS_HOST }}" ]; then
          echo "::error::ECS_HOST secret is empty!"
          exit 1
        fi
        if [ -z "${{ secrets.ECS_USER }}" ]; then
          echo "::error::ECS_USER secret is empty!"
          exit 1
        fi
        if [ -z "${{ secrets.ECS_SSH_KEY }}" ]; then
          echo "::error::ECS_SSH_KEY secret is empty!"
          exit 1
        fi
        if [ -z "${{ secrets.JWT_SECRET }}" ]; then
          echo "::warning::JWT_SECRET not set, will use default (insecure for production!)"
        fi
        echo "All required secrets loaded successfully!"

    - name: Deploy to ECS via SSH
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: "${{ secrets.ECS_SSH_KEY }}"
        REMOTE_HOST: "${{ secrets.ECS_HOST }}"
        REMOTE_USER: "${{ secrets.ECS_USER }}"
        REMOTE_PORT: "22"
        SOURCE: "blog-release.tar.gz"
        TARGET: "/tmp"
        SCRIPT_AFTER: |
          echo "Extracting release..."
          mkdir -p /opt/blog/backend/target/release
          mkdir -p /opt/blog/frontend
          mkdir -p /opt/blog/logs
          tar -xzf /tmp/blog-release.tar.gz -C /opt/blog

          echo "Setting permissions..."
          chmod +x /opt/blog/backend/target/release/blog-backend

          echo "Installing systemd services..."
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET="default-secret-key-change-in-production"
          fi
          sed "s/\${JWT_SECRET}/$JWT_SECRET/g" /opt/blog/deploy/blog-api.service > /etc/systemd/system/blog-api.service
          cp /opt/blog/deploy/blog.service /etc/systemd/system/

          echo "Stopping old services..."
          systemctl stop blog || true
          systemctl stop blog-api || true
          killall nginx 2>/dev/null || true
          sleep 2

          echo "Setting up Nginx..."
          cp /opt/blog/deploy/nginx.conf /etc/nginx/nginx.conf
          nginx -t && systemctl start nginx

          echo "Starting services..."
          systemctl daemon-reload
          systemctl start blog-api
          systemctl enable blog-api
          systemctl start blog
          systemctl enable blog

          echo "Waiting for service to start..."
          sleep 3
          systemctl status blog-api --no-pager || true

          echo "Cleanup..."
          rm -f /tmp/blog-release.tar.gz

          echo "Deploy completed!"
